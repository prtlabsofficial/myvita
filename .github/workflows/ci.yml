name: CI

on:
  push:
    branches: ["main"]
  pull_request:

# Cancel a superseded run on the same branch instead of letting two runs of
# the same PR race each other for the Postgres service container.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  # NOT a real secret: a fixed, throwaway value used only inside this CI
  # job's ephemeral Postgres container, which never exists outside this
  # run. Real deployments must set a generated JWT_SECRET_KEY via their own
  # secret store — see backend/.env.example and README.md#security.
  JWT_SECRET_KEY: "ci-only-not-a-real-secret-do-not-reuse"
  DATABASE_URL: "postgresql+psycopg://myvita:myvita@localhost:5432/myvita"
  TEST_DATABASE_URL: "postgresql+psycopg://myvita:myvita@localhost:5432/myvita"
  COOKIE_SECURE: "false"

jobs:
  backend:
    name: Backend (lint, types, tests, migrations)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: myvita
          POSTGRES_PASSWORD: myvita
          POSTGRES_DB: myvita
        ports:
          - 5432:5432
        # Wait for Postgres to actually accept connections before any step
        # tries to use it — without this, migrations/tests can flake on a
        # container that's still starting up.
        options: >-
          --health-cmd "pg_isready -U myvita"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Verify the app actually imports
        run: python -c "import app.main"

      - name: Lint (ruff)
        run: ruff check .

      - name: Type check (mypy)
        run: mypy app

      - name: Migrations — upgrade head on a clean database
        run: python -m alembic upgrade head

      - name: Migrations — downgrade one step then upgrade again
        run: |
          python -m alembic downgrade -1
          python -m alembic upgrade head

      - name: Tests with coverage
        run: pytest --cov=app --cov-report=term-missing --cov-report=xml

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-xml
          path: backend/coverage.xml

  dependency-scan:
    name: Dependency vulnerability scan (pip-audit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Advisory, not blocking: a new CVE in a transitive dependency can
      # appear overnight with no code change on our side. Failing CI on
      # every such disclosure would train people to ignore red CI rather
      # than fix real problems. The scan still runs on every push/PR and
      # its findings are visible in the job log either way.
      - name: pip-audit
        run: pip-audit -r requirements.txt
        continue-on-error: true

  docker-build:
    name: Docker image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -t myvita-backend:ci backend
