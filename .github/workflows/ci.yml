name: CI

on:
  push:
    branches: ["main"]
  pull_request:

# Cancel a superseded run on the same branch instead of letting two runs of
# the same PR race each other for the Postgres service container.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  # NOT a real secret: a fixed, throwaway value used only inside this CI
  # job's ephemeral Postgres container, which never exists outside this
  # run. Real deployments must set a generated JWT_SECRET_KEY via their own
  # secret store — see backend/.env.example and README.md#security.
  JWT_SECRET_KEY: "ci-only-not-a-real-secret-do-not-reuse"
  # Dedicated, disposable test database: the suite drops and re-migrates
  # its schema, and tests/db_safety.py refuses any name not ending in _test.
  DATABASE_URL: "postgresql+psycopg://myvita:myvita@localhost:5432/myvita_test"
  TEST_DATABASE_URL: "postgresql+psycopg://myvita:myvita@localhost:5432/myvita_test"
  # The CI Postgres login is a superuser, so the least-privilege/audit
  # immutability tests must run — never silently skip them here.
  MYVITA_REQUIRE_DB_PRIVILEGE_TESTS: "1"
  COOKIE_SECURE: "false"

jobs:
  repository-quality:
    name: Repository formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reject whitespace errors
        run: git diff --check HEAD~1 HEAD

  backend:
    name: Backend (lint, types, tests, migrations)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: myvita
          POSTGRES_PASSWORD: myvita
          POSTGRES_DB: myvita_test
        ports:
          - 5432:5432
        # Wait for Postgres to actually accept connections before any step
        # tries to use it — without this, migrations/tests can flake on a
        # container that's still starting up.
        options: >-
          --health-cmd "pg_isready -U myvita"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Verify the app actually imports
        run: python -c "import app.main"

      - name: Lint (ruff)
        run: ruff check .

      - name: Backup script safety tests
        run: |
          bash ../scripts/test_backup_scripts.sh
          bash ../scripts/test_offsite_backup_scripts.sh

      - name: Type check (mypy)
        run: mypy app

      - name: Migrations — upgrade head on a clean database
        run: python -m alembic upgrade head

      - name: Migrations — downgrade one step then upgrade again
        run: |
          python -m alembic downgrade -1
          python -m alembic upgrade head

      - name: Tests with coverage
        run: pytest --cov=app --cov-report=term-missing --cov-report=xml

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-xml
          path: backend/coverage.xml

  dependency-scan:
    name: Dependency vulnerability scan (pip-audit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Blocking, not advisory: every known vulnerability fails the build.
      # Any future exception must be narrowly justified in
      # backend/SECURITY-EXCEPTIONS.md before CI is changed.
      - name: pip-audit (dependency vulnerability gate)
        run: pip-audit -r requirements.txt

  security-scan:
    name: Static security and secret history scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Bandit (medium/high confidence Python findings)
        run: |
          pip install bandit==1.9.4
          bandit -r backend/app --severity-level medium --confidence-level medium

      - name: Gitleaks (complete Git history)
        run: >-
          docker run --rm -v "$PWD:/repo"
          ghcr.io/gitleaks/gitleaks:v8.29.1@sha256:aa036a2f4bdfe3cc3c55fa4326308efabb4a6be498c883c864fd1d0d5585438a
          detect --source=/repo --config=/repo/.gitleaks.toml --no-banner --redact

  docker-build:
    name: Docker image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -t myvita-backend:ci backend
      - name: Build frontend image
        run: docker build -t myvita-frontend:ci frontend
      - name: Build backup image
        run: docker build -f backup/Dockerfile -t myvita-backup:ci .
      - name: Build public proxy image
        run: docker build -t myvita-proxy:ci proxy
      - name: Build metrics proxy image
        run: docker build -t myvita-metrics-proxy:ci monitoring/metrics-proxy
      - name: Validate monitoring configuration and alert behavior
        run: |
          docker run --rm --entrypoint /bin/promtool \
            -v "$PWD/monitoring:/etc/prometheus:ro" prom/prometheus:v3.5.0 \
            check config /etc/prometheus/prometheus.yml
          docker run --rm --entrypoint /bin/promtool \
            -v "$PWD/monitoring:/etc/prometheus:ro" prom/prometheus:v3.5.0 \
            test rules /etc/prometheus/alerts.test.yml
          python -m json.tool monitoring/grafana/dashboards/myvita-operations.json >/dev/null
          POSTGRES_USER=ci POSTGRES_PASSWORD=ci POSTGRES_DB=ci \
          JWT_SECRET_KEY=ci-only-not-a-real-secret-do-not-reuse PUBLIC_DOMAIN=localhost \
          APP_DB_ROLE=myvita_app APP_DB_PASSWORD=ci-runtime-db-password-only \
          MFA_ENCRYPTION_KEY=Y2ktb25seS1tZmEta2V5LW5vdC1hLXJlYWwtc2VjISE= \
          PRIVACY_FINGERPRINT_KEY=ci-only-fingerprint-key-not-a-real-secret \
          ALLOWED_HOSTS='["localhost"]' \
          METRICS_TOKEN=ci-metrics-only GRAFANA_ADMIN_PASSWORD=ci-grafana-only \
          docker compose -f docker-compose.prod.yml -f docker-compose.monitoring.yml config --quiet

      - name: Production readiness preflight (ephemeral CI values)
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci-database-only
          POSTGRES_DB: ci
          JWT_SECRET_KEY: ci-generated-signing-material-ABCdef1234567890!
          APP_DB_ROLE: myvita_app
          APP_DB_PASSWORD: ci-runtime-db-password-only
          MFA_ENCRYPTION_KEY: Y2ktb25seS1tZmEta2V5LW5vdC1hLXJlYWwtc2VjISE=
          PRIVACY_FINGERPRINT_KEY: ci-only-fingerprint-key-not-a-real-secret
          PUBLIC_DOMAIN: pilot-ci.example.test
          ALLOWED_HOSTS: '["pilot-ci.example.test"]'
          CORS_ORIGINS: '["https://pilot-ci.example.test"]'
          METRICS_TOKEN: ci-generated-metrics-ABCdef1234567890!
          GRAFANA_ADMIN_PASSWORD: ci-grafana-only
        run: scripts/production_preflight.sh

  frontend:
    name: Frontend (typecheck, lint, tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Dependency vulnerability gate
        run: npm audit --audit-level=high

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm run test

      - name: Production build
        run: npm run build
